<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>יומן בריאות וחיוניות</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #0f172a; --card-bg: #1e293b; --card-border: #334155;
      --easy: #22c55e; --mod: #eab308; --hard: #ef4444; 
      --text: #f8fafc; --text-muted: #94a3b8; --gold: #fbbf24;
      --silver: #94a3b8; --bronze: #b45309; --plat: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); line-height: 1.5; padding: 20px; max-width: 1100px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--card-border); flex-wrap: wrap; gap: 12px; }
    h1 { font-size: 1.35rem; color: #fff; }
    
    .nav-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); padding: 7px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    .tab-btn.active { background: #fff; color: #0f172a; border-color: #fff; }
    
    .cycle-control { display: flex; gap: 6px; align-items: center; background: var(--card-bg); padding: 5px 8px; border-radius: 8px; border: 1px solid var(--card-border); }
    .cycle-btn { background: transparent; border: 1px solid var(--card-border); color: var(--text); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.8rem; }
    .cycle-btn.active { background: #fff; color: #0f172a; border-color: #fff; }
    
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
    .card h2 { font-size: 1.15rem; margin-bottom: 14px; color: #fff; border-bottom: 1px solid var(--card-border); padding-bottom: 8px; }

    /* Blueprint HUD */
    .blueprint-hud { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .bp-stat { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; transition: opacity 0.3s; }
    .bp-stat.completed { opacity: 0.4; filter: grayscale(80%); }
    .bp-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; }
    .bp-bar-bg { background: #0f172a; border-radius: 999px; height: 8px; width: 100%; overflow: hidden; border: 1px solid var(--card-border); }
    .bp-bar-fill { height: 100%; transition: width 0.4s ease; }
    .bp-snack .bp-header { color: var(--easy); } .bp-snack .bp-bar-fill { background: var(--easy); }
    .bp-aero .bp-header { color: var(--mod); } .bp-aero .bp-bar-fill { background: var(--mod); }
    .bp-res .bp-header { color: var(--hard); } .bp-res .bp-bar-fill { background: var(--hard); }

    /* Day Selector */
    .day-selector { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 20px; }
    .day-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); padding: 10px; border-radius: 8px; cursor: pointer; text-align: center; }
    .day-btn.active { border-color: #fff; box-shadow: 0 0 0 1px #fff; }
    .day-btn .status-dot { width: 8px; height: 8px; border-radius: 50%; margin: 4px auto 0; background: var(--card-border); }
    .day-btn.has-data .status-dot { background: var(--easy); }

    /* Blocks */
    .add-block-row { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .btn { background: #fff; color: #0f172a; border: none; padding: 9px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .btn-snack { background: rgba(34, 197, 94, 0.15); color: var(--easy); border: 1px solid var(--easy); }
    .btn-aero { background: rgba(234, 179, 8, 0.15); color: var(--mod); border: 1px solid var(--mod); }
    .btn-res { background: rgba(239, 68, 68, 0.15); color: var(--hard); border: 1px solid var(--hard); }
    .btn-snack:hover { background: var(--easy); color: #0f172a; }
    .btn-aero:hover { background: var(--mod); color: #0f172a; }
    .btn-res:hover { background: var(--hard); color: #0f172a; }

    .session-block { background: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; padding: 14px; margin-bottom: 12px; border-right: 4px solid var(--card-border); }
    .session-block.type-snack { border-right-color: var(--easy); }
    .session-block.type-aerobic { border-right-color: var(--mod); }
    .session-block.type-resistance { border-right-color: var(--hard); }
    
    .block-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .block-title { font-size: 1rem; font-weight: 700; }
    .type-snack .block-title { color: var(--easy); }
    .type-aerobic .block-title { color: var(--mod); }
    .type-resistance .block-title { color: var(--hard); }
    .del-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; }
    .del-btn:hover { color: var(--hard); }

    .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
    select, input, textarea { background: #1e293b; border: 1px solid var(--card-border); color: var(--text); padding: 8px 10px; border-radius: 6px; outline: none; }
    
    /* Effort Picker */
    .color-picker { display: flex; gap: 6px; }
    .color-btn { flex: 1; padding: 6px; border-radius: 6px; border: 2px solid transparent; font-weight: bold; font-size: 0.8rem; cursor: pointer; text-align: center; transition: 0.2s; }
    .color-btn.c-green { background: rgba(34, 197, 94, 0.15); color: var(--easy); }
    .color-btn.c-yellow { background: rgba(234, 179, 8, 0.15); color: var(--mod); }
    .color-btn.c-red { background: rgba(239, 68, 68, 0.15); color: var(--hard); }
    .color-btn.c-green.selected { background: var(--easy); color: #000; border-color: #fff; }
    .color-btn.c-yellow.selected { background: var(--mod); color: #000; border-color: #fff; }
    .color-btn.c-red.selected { background: var(--hard); color: #000; border-color: #fff; }

    /* Gamification Tab */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .stat-card { background: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; padding: 16px; text-align: center; }
    .stat-val { font-size: 1.8rem; font-weight: 800; color: #fff; margin: 4px 0; }
    
    .badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .badge-card { background: rgba(30, 41, 59, 0.6); border: 1px solid var(--card-border); border-radius: 8px; padding: 12px; text-align: center; transition: all 0.2s; opacity: 0.3; filter: grayscale(100%); position: relative; overflow: hidden; }
    .badge-card.unlocked { opacity: 1; filter: grayscale(0%); }
    .badge-card.tier-bronze.unlocked { border-color: var(--bronze); box-shadow: inset 0 0 10px rgba(180, 83, 9, 0.1); }
    .badge-card.tier-silver.unlocked { border-color: var(--silver); box-shadow: inset 0 0 10px rgba(148, 163, 184, 0.1); }
    .badge-card.tier-gold.unlocked { border-color: var(--gold); box-shadow: inset 0 0 10px rgba(251, 191, 36, 0.1); }
    .badge-card.tier-plat.unlocked { border-color: var(--plat); box-shadow: inset 0 0 10px rgba(56, 189, 248, 0.1); }
    .badge-icon { font-size: 2rem; margin-bottom: 4px; }
    .badge-title { font-size: 0.8rem; font-weight: 700; color: #fff; display: block; }
    .badge-desc { font-size: 0.7rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>יומן בריאות וחיוניות</h1>
    </div>
    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
      <div class="nav-tabs">
        <button class="tab-btn active" id="tabLogger" onclick="switchView('logger')">יומן אימונים</button>
        <button class="tab-btn" id="tabChallenge" onclick="switchView('challenge')">אתגר שבועי</button>
        <button class="tab-btn" id="tabTrophy" onclick="switchView('trophy')">חדר גביעים</button>
        <button class="tab-btn" id="tabDatabase" onclick="switchView('database')">הגדרות וסנכרון</button>
      </div>
      <div class="cycle-control" id="cycleControls">
        <button class="cycle-btn" onclick="changeCycle(-1)" style="padding: 2px 8px;">&lt;</button>
        <span style="font-size: 0.8rem; font-weight: 600; margin: 0 4px;" id="cycleLabel">מחזור 1</span>
        <button class="cycle-btn" onclick="changeCycle(1)" style="padding: 2px 8px; margin-right: 8px;">&gt;</button>
        <div id="dynamicWeekButtons" style="display: flex; gap: 4px; margin-right: 6px;"></div>
      </div>
    </div>
  </header>

  <div id="loggerView">
    <div class="blueprint-hud" id="blueprintHud">
      <!-- Injected by JS -->
    </div>

    <div class="day-selector" id="daySelector"></div>

    <div class="card">
      <div class="add-block-row">
        <button class="btn btn-aero" onclick="addBlock('aerobic')">+ אירובי</button>
        <button class="btn btn-res" onclick="addBlock('resistance')">+ אימון כוח</button>
        <button class="btn btn-snack" onclick="addBlock('snack')">+ חטיף יומי</button>
      </div>

      <div id="blocksContainer"></div>

      <div style="margin-top:20px; background: rgba(255,255,255,0.02); padding: 16px; border-radius: 8px; border: 1px solid var(--card-border);">
        <div class="form-group" style="margin-bottom: 12px;">
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: #fff; font-size: 0.95rem;">
            <input type="checkbox" id="logCouples" style="width: 18px; height: 18px; accent-color: var(--plat);" onchange="updateDailyMeta('couples', this.checked)" />
            👩‍❤️‍👨 אימון זוגי משותף
          </label>
        </div>
        <div class="form-group">
          <label>הערות / איך הרגיש היום?</label>
          <textarea id="logNotes" rows="2" placeholder="הרגשה כללית, דגשים לפעם הבאה..." oninput="updateDailyMeta('notes', this.value)"></textarea>
        </div>
        <button class="btn" style="width: 100%; margin-top: 12px; background: var(--easy);" onclick="saveDay()">💾 שמור יומן</button>
      </div>
    </div>
  </div>

  <div id="challengeView" style="display: none;">
    <div class="card" id="challengeContainer">
      <!-- Injected by JS -->
    </div>
  </div>

  <div id="trophyView" style="display: none;">
    <div class="card">
      <h2>סיכום נתונים מצטבר</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <label>סך הכל אימונים</label>
          <div class="stat-val" id="statWorkouts">0</div>
        </div>
        <div class="stat-card">
          <label>מרחק מצטבר (ק״מ)</label>
          <div class="stat-val" id="statDistance">0.0</div>
        </div>
        <div class="stat-card">
          <label>זמן פעילות (שעות)</label>
          <div class="stat-val" id="statTime">0.0</div>
        </div>
        <div class="stat-card">
          <label>אימונים זוגיים</label>
          <div class="stat-val" id="statCouples">0</div>
        </div>
      </div>

      <h2 style="margin-top: 24px;">תגים והישגים</h2>
      <div class="badge-grid" id="badgeContainer"></div>
    </div>
  </div>

  <div id="databaseView" style="display: none;">
    <div class="card">
      <h2>הגדרות תוכנית בסיס (שבועית)</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px;">הגדירי את כמות האימונים הרצויה מדי שבוע. התוכנית תישאר קבועה עד שתשני אותה כאן.</p>
      
      <div class="form-row">
        <div class="form-group">
          <label style="color: var(--mod);">אירובי (יעד)</label>
          <input type="number" id="bpAeroTarget" min="0" max="10" value="2" />
        </div>
        <div class="form-group">
          <label style="color: var(--hard);">כוח (יעד)</label>
          <input type="number" id="bpResTarget" min="0" max="10" value="2" />
        </div>
        <div class="form-group">
          <label style="color: var(--easy);">חטיפים (יעד)</label>
          <input type="number" id="bpSnackTarget" min="0" max="10" value="2" />
        </div>
      </div>
      <button class="btn" style="background: #fff; color: #0f172a; margin-bottom: 24px;" onclick="saveBlueprintTargets()">עדכן תוכנית בסיס</button>

      <div style="border-top: 1px solid var(--card-border); padding-top: 24px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h2>סנכרון וגיבוי גוגל דרייב</h2>
        </div>
        
        <div class="form-group" style="margin-bottom: 16px;">
          <label>מזהה לקוח (Client ID)</label>
          <input type="text" id="gcpClientId" placeholder="YOUR_CLIENT_ID.apps.googleusercontent.com" dir="ltr" style="text-align: left;" />
          <button class="btn" style="background: var(--easy); color: #0f172a; margin-top: 6px; width: max-content; padding: 4px 10px; font-size: 0.85rem;" onclick="saveClientId()">שמור מזהה</button>
        </div>

        <div style="background: rgba(15, 23, 42, 0.4); border: 1px solid var(--card-border); padding: 12px; border-radius: 8px;">
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button class="btn" style="background: var(--plat); color: #0f172a;" onclick="authenticateDrive('push')">☁️ גבה נתונים לדרייב</button>
            <button class="btn" style="background: var(--plat); color: #0f172a;" onclick="authenticateDrive('pull')">⬇️ שחזר נתונים מהדרייב</button>
          </div>
        </div>
        <div id="syncStatus" style="font-size: 0.85rem; margin-top: 12px; color: var(--mod);"></div>
      </div>
    </div>
  </div>

  <script>
    const DAYS = [
      { id: "sun", name: "ראשון", short: "א'" }, { id: "mon", name: "שני", short: "ב'" },
      { id: "tue", name: "שלישי", short: "ג'" }, { id: "wed", name: "רביעי", short: "ד'" },
      { id: "thu", name: "חמישי", short: "ה'" }, { id: "fri", name: "שישי", short: "ו'" },
      { id: "sat", name: "שבת", short: "ש'" }
    ];

    const CAT_AERO = ["ריצה", "הליכה", "קפיצה בחבל", "אופניים", "שחייה", "אחר"];
    const CAT_RES = ["קטלבלס", "משקל גוף", "גומיות התנגדות", "משקולות חופשיים", "אחר"];

    const BADGES = [
      { id: "w_br", type: "workouts", tier: "bronze", title: "התחלה חזקה", desc: "10 אימונים", thresh: 10, icon: "👟" },
      { id: "w_sv", type: "workouts", tier: "silver", title: "עקבית", desc: "50 אימונים", thresh: 50, icon: "👟" },
      { id: "w_gd", type: "workouts", tier: "gold", title: "מכונת אימונים", desc: "100 אימונים", thresh: 100, icon: "👟" },
      { id: "w_pt", type: "workouts", tier: "plat", title: "אגדה", desc: "250 אימונים", thresh: 250, icon: "👟" },
      
      { id: "d_br", type: "distance", tier: "bronze", title: "מגלה ארצות", desc: "20 ק״מ", thresh: 20, icon: "🗺️" },
      { id: "d_sv", type: "distance", tier: "silver", title: "נודדת", desc: "100 ק״מ", thresh: 100, icon: "🗺️" },
      { id: "d_gd", type: "distance", tier: "gold", title: "מרתון", desc: "250 ק״מ", thresh: 250, icon: "🗺️" },
      { id: "d_pt", type: "distance", tier: "plat", title: "חוצת יבשות", desc: "500 ק״מ", thresh: 500, icon: "🗺️" },
      
      { id: "t_br", type: "time", tier: "bronze", title: "תזוזה", desc: "10 שעות פעילות", thresh: 600, icon: "⏱️" },
      { id: "t_sv", type: "time", tier: "silver", title: "מוקדשת", desc: "50 שעות פעילות", thresh: 3000, icon: "⏱️" },
      { id: "t_gd", type: "time", tier: "gold", title: "זמן ברזל", desc: "100 שעות פעילות", thresh: 6000, icon: "⏱️" },
      { id: "t_pt", type: "time", tier: "plat", title: "מאסטרית הזמן", desc: "250 שעות פעילות", thresh: 15000, icon: "⏱️" },
      
      { id: "c_br", type: "couples", tier: "bronze", title: "זוגיות פעילה", desc: "5 אימונים משותפים", thresh: 5, icon: "🤝" },
      { id: "c_sv", type: "couples", tier: "silver", title: "זמן איכות", desc: "10 אימונים משותפים", thresh: 10, icon: "🤝" },
      { id: "c_gd", type: "couples", tier: "gold", title: "צוות לעניין", desc: "25 אימונים משותפים", thresh: 25, icon: "🤝" },
      { id: "c_pt", type: "couples", tier: "plat", title: "פאוור קאפל", desc: "50 אימונים משותפים", thresh: 50, icon: "🤝" }
    ];

    let state = JSON.parse(localStorage.getItem("health_v2_state")) || {
      meta: { cycle: 1, week: 1, day: DAYS[new Date().getDay()].id },
      blueprint: { aerobic: 2, resistance: 2, snack: 2 },
      logs: {},
      challenges: {}
    };
    
    // Safety check for legacy saves
    if(!state.challenges) state.challenges = {};
    
    let stats = { workouts: 0, distance: 0, time: 0, couples: 0 };

    function init() {
      document.getElementById("gcpClientId").value = localStorage.getItem("gdrive_client_id") || "";
      document.getElementById("bpAeroTarget").value = state.blueprint.aerobic;
      document.getElementById("bpResTarget").value = state.blueprint.resistance;
      document.getElementById("bpSnackTarget").value = state.blueprint.snack;
      
      recalcStats();
      renderNavigation();
      renderDaySelector();
      renderBlueprintHUD();
      renderBlocks();
      renderChallenge();
    }

    function switchView(view) {
      document.getElementById("loggerView").style.display = view === "logger" ? "block" : "none";
      document.getElementById("challengeView").style.display = view === "challenge" ? "block" : "none";
      document.getElementById("trophyView").style.display = view === "trophy" ? "block" : "none";
      document.getElementById("databaseView").style.display = view === "database" ? "block" : "none";
      
      document.getElementById("cycleControls").style.display = (view === "logger" || view === "challenge") ? "flex" : "none";
      
      document.getElementById("tabLogger").classList.toggle("active", view === "logger");
      document.getElementById("tabChallenge").classList.toggle("active", view === "challenge");
      document.getElementById("tabTrophy").classList.toggle("active", view === "trophy");
      document.getElementById("tabDatabase").classList.toggle("active", view === "database");
      
      if(view === "trophy") renderTrophyRoom();
      if(view === "challenge") renderChallenge();
    }

    function changeCycle(dir) {
      state.meta.cycle = Math.max(1, state.meta.cycle + dir);
      state.meta.week = 1;
      saveState(); 
      renderNavigation(); 
      renderDaySelector(); 
      renderBlueprintHUD(); 
      renderBlocks();
      renderChallenge();
    }

    function setWeek(w) {
      state.meta.week = w;
      saveState(); 
      renderNavigation(); 
      renderDaySelector(); 
      renderBlueprintHUD(); 
      renderBlocks();
      renderChallenge();
    }

    function setDay(d) {
      state.meta.day = d;
      saveState(); renderDaySelector(); renderBlocks();
    }

    function renderNavigation() {
      document.getElementById("cycleLabel").innerText = `מחזור ${state.meta.cycle}`;
      const container = document.getElementById("dynamicWeekButtons");
      container.innerHTML = "";
      for(let w=1; w<=6; w++) {
        const btn = document.createElement("button");
        btn.className = `cycle-btn ${w === state.meta.week ? "active" : ""}`;
        btn.innerText = `ש' ${w}`;
        btn.onclick = () => setWeek(w);
        container.appendChild(btn);
      }
    }

    function renderDaySelector() {
      const container = document.getElementById("daySelector");
      container.innerHTML = "";
      DAYS.forEach(day => {
        const key = `c${state.meta.cycle}_w${state.meta.week}_${day.id}`;
        const hasData = state.logs[key] && (state.logs[key].aerobic?.length > 0 || state.logs[key].resistance?.length > 0 || state.logs[key].snack?.length > 0);
        const btn = document.createElement("button");
        btn.className = `day-btn ${day.id === state.meta.day ? "active" : ""} ${hasData ? "has-data" : ""}`;
        btn.onclick = () => setDay(day.id);
        btn.innerHTML = `<span style="font-weight:700;font-size:0.9rem;">${day.short}</span><span class="status-dot"></span>`;
        container.appendChild(btn);
      });
    }

    function getCurrentKey() { return `c${state.meta.cycle}_w${state.meta.week}_${state.meta.day}`; }
    function getChallengeKey() { return `c${state.meta.cycle}_w${state.meta.week}`; }

    function getWeeklyCounts() {
      let counts = { aerobic: 0, resistance: 0, snack: 0 };
      DAYS.forEach(d => {
        const key = `c${state.meta.cycle}_w${state.meta.week}_${d.id}`;
        if(state.logs[key]) {
          if(state.logs[key].aerobic) counts.aerobic += state.logs[key].aerobic.length;
          if(state.logs[key].resistance) counts.resistance += state.logs[key].resistance.length;
          if(state.logs[key].snack) counts.snack += state.logs[key].snack.length;
        }
      });
      return counts;
    }

    function renderBlueprintHUD() {
      const counts = getWeeklyCounts();
      const hud = document.getElementById("blueprintHud");
      
      const drawBar = (type, label, cssClass, count, target) => {
        let pct = target > 0 ? Math.min(100, (count / target) * 100) : 100;
        let isComp = target > 0 && count >= target;
        return `
          <div class="bp-stat ${cssClass} ${isComp ? 'completed' : ''}">
            <div class="bp-header"><span>${label}</span> <span>${count} / ${target}</span></div>
            <div class="bp-bar-bg"><div class="bp-bar-fill" style="width: ${pct}%;"></div></div>
          </div>
        `;
      };

      hud.innerHTML = 
        drawBar('aerobic', 'אירובי (צהוב)', 'bp-aero', counts.aerobic, state.blueprint.aerobic) +
        drawBar('resistance', 'כוח (אדום)', 'bp-res', counts.resistance, state.blueprint.resistance) +
        drawBar('snack', 'חטיף (ירוק)', 'bp-snack', counts.snack, state.blueprint.snack);
    }

    function ensureLogExists() {
      const key = getCurrentKey();
      if(!state.logs[key]) state.logs[key] = { aerobic: [], resistance: [], snack: [], couples: false, notes: "" };
      return key;
    }

    function addBlock(type) {
      const key = ensureLogExists();
      let defaultEffort = type === 'aerobic' ? 2 : (type === 'resistance' ? 3 : 1);
      state.logs[key][type].push({
        id: Date.now().toString(), subcat: type==='aerobic' ? CAT_AERO[0] : CAT_RES[0],
        time: "", distance: "", effort: defaultEffort
      });
      saveState(); renderBlocks(); renderBlueprintHUD();
    }

    function delBlock(type, id) {
      const key = getCurrentKey();
      state.logs[key][type] = state.logs[key][type].filter(b => b.id !== id);
      saveState(); renderBlocks(); renderBlueprintHUD();
    }

    function updateBlockField(type, id, field, val) {
      const key = getCurrentKey();
      const block = state.logs[key][type].find(b => b.id === id);
      if(block) {
        if(field === 'time' || field === 'distance') block[field] = val === "" ? "" : parseFloat(val);
        else block[field] = val;
        saveState(); 
      }
    }

    function updateEffort(type, id, val) {
      updateBlockField(type, id, 'effort', parseInt(val));
      renderBlocks(); 
    }

    function updateDailyMeta(field, val) {
      const key = ensureLogExists();
      state.logs[key][field] = val;
      saveState();
    }

    function renderBlocks() {
      const key = getCurrentKey();
      const log = state.logs[key] || { aerobic: [], resistance: [], snack: [], couples: false, notes: "" };
      const container = document.getElementById("blocksContainer");
      container.innerHTML = "";

      document.getElementById("logCouples").checked = log.couples;
      document.getElementById("logNotes").value = log.notes;

      const renderType = (type, label, blocks, catList) => {
        blocks.forEach(b => {
          let catOpts = catList.map(c => `<option value="${c}" ${b.subcat===c?'selected':''}>${c}</option>`).join("");
          let distHtml = type === 'aerobic' ? `
            <div class="form-group">
              <label>מרחק (ק״מ)</label>
              <input type="number" step="0.1" value="${b.distance || ''}" oninput="updateBlockField('${type}', '${b.id}', 'distance', this.value)" />
            </div>` : '';

          container.innerHTML += `
            <div class="session-block type-${type}">
              <div class="block-header">
                <span class="block-title">${label}</span>
                <button class="del-btn" onclick="delBlock('${type}', '${b.id}')">✕</button>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>סוג פעילות</label>
                  <select onchange="updateBlockField('${type}', '${b.id}', 'subcat', this.value)">${catOpts}</select>
                </div>
                <div class="form-group">
                  <label>זמן (דקות)</label>
                  <input type="number" value="${b.time || ''}" oninput="updateBlockField('${type}', '${b.id}', 'time', this.value)" />
                </div>
                ${distHtml}
              </div>
              <div class="form-group" style="margin-top:4px;">
                <label>מאמץ שהושקע</label>
                <div class="color-picker">
                  <div class="color-btn c-green ${b.effort===1?'selected':''}" onclick="updateEffort('${type}', '${b.id}', 1)">🟢 קל</div>
                  <div class="color-btn c-yellow ${b.effort===2?'selected':''}" onclick="updateEffort('${type}', '${b.id}', 2)">🟡 בינוני</div>
                  <div class="color-btn c-red ${b.effort===3?'selected':''}" onclick="updateEffort('${type}', '${b.id}', 3)">🔴 קשה</div>
                </div>
              </div>
            </div>
          `;
        });
      };

      renderType('aerobic', 'אימון אירובי', log.aerobic, CAT_AERO);
      renderType('resistance', 'אימון כוח', log.resistance, CAT_RES);
      renderType('snack', 'חטיף יומי', log.snack, CAT_RES);

      if(log.aerobic.length === 0 && log.resistance.length === 0 && log.snack.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-muted); font-size: 0.9rem;">אין אימונים להיום. לחצי על הכפתורים למעלה כדי להוסיף.</div>`;
      }
    }

    // --- CHALLENGE TAB LOGIC ---
    function renderChallenge() {
      const key = getChallengeKey();
      const container = document.getElementById("challengeContainer");
      const challenge = state.challenges[key];

      if (!challenge) {
        container.innerHTML = `
          <h2>הגדרת אתגר שבועי חדש</h2>
          <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 16px;">בחרי תרגיל אחד ויעד חזרות שבועי כדי לאתגר את עצמך. (למשל: 100 שכיבות סמיכה מצטברות השבוע).</p>
          <div class="form-group">
            <label>שם התרגיל</label>
            <input type="text" id="chalName" placeholder="הקלידי שם תרגיל (למשל סקוואט)..." />
          </div>
          <div class="form-group" style="margin-top: 12px;">
            <label>יעד חזרות שבועי (סה״כ)</label>
            <input type="number" id="chalTarget" placeholder="למשל: 100" />
          </div>
          <button class="btn" style="background: var(--gold); color: #0f172a; margin-top: 16px; width: 100%;" onclick="startChallenge()">🎯 התחל אתגר</button>
        `;
      } else {
        const pct = Math.min(100, (challenge.progress / challenge.target) * 100);
        const isCompleted = challenge.progress >= challenge.target;
        
        container.innerHTML = `
          <h2 style="color: var(--gold);">${challenge.name} (שבוע ${state.meta.week})</h2>
          <div style="font-size: 1.1rem; font-weight: bold; margin-bottom: 8px;">${challenge.progress} / ${challenge.target} חזרות מבוצעות</div>
          
          <div class="bp-bar-bg" style="height: 12px; margin-bottom: 24px;">
            <div class="bp-bar-fill" style="width: ${pct}%; background: var(--gold);"></div>
          </div>
          
          ${isCompleted ? `<div style="color: var(--easy); font-weight: bold; text-align: center; font-size: 1.2rem; margin-bottom: 16px;">🏆 האתגר השבועי הושלם בהצלחה!</div>` : ''}
          
          <div style="background: rgba(255,255,255,0.05); padding: 16px; border-radius: 8px; border: 1px solid var(--card-border);">
            <label style="display: block; margin-bottom: 8px;">כמה חזרות ביצעת עכשיו?</label>
            <div style="display: flex; gap: 8px;">
              <select id="chalAddSelect" style="flex: 1; font-size: 1rem; padding: 10px;">
                ${[5, 10, 15, 20, 25, 30, 40, 50, 100].map(n => `<option value="${n}">+ ${n} חזרות</option>`).join('')}
              </select>
              <button class="btn" style="background: var(--easy); color: #0f172a;" onclick="addChallengeReps()">➕ הוסף</button>
            </div>
          </div>
          
          <button class="btn" style="background: transparent; color: var(--danger); border: 1px solid var(--danger); width: 100%; margin-top: 24px;" onclick="resetChallenge()">🗑️ ביטול והחלפת האתגר הנוכחי</button>
        `;
      }
    }

    function startChallenge() {
      const name = document.getElementById("chalName").value.trim();
      const target = parseInt(document.getElementById("chalTarget").value);
      
      if (!name || isNaN(target) || target <= 0) {
        alert("נא להזין שם תרגיל תקין ויעד הגדול מ-0.");
        return;
      }

      const key = getChallengeKey();
      state.challenges[key] = { name, target, progress: 0 };
      saveState();
      renderChallenge();
    }

    function addChallengeReps() {
      const key = getChallengeKey();
      const added = parseInt(document.getElementById("chalAddSelect").value);
      if (state.challenges[key] && !isNaN(added)) {
        state.challenges[key].progress += added;
        saveState();
        renderChallenge();
      }
    }

    function resetChallenge() {
      if (confirm("האם למחוק את האתגר הנוכחי ולהגדיר אתגר חדש? כל התקדמות האתגר בשבוע זה תאבד.")) {
        const key = getChallengeKey();
        delete state.challenges[key];
        saveState();
        renderChallenge();
      }
    }

    function saveDay() {
      recalcStats();
      renderDaySelector();
      renderBlueprintHUD();
      alert("האימונים והנתונים נשמרו בהצלחה!");
    }

    function saveBlueprintTargets() {
      state.blueprint.aerobic = parseInt(document.getElementById("bpAeroTarget").value) || 0;
      state.blueprint.resistance = parseInt(document.getElementById("bpResTarget").value) || 0;
      state.blueprint.snack = parseInt(document.getElementById("bpSnackTarget").value) || 0;
      saveState(); renderBlueprintHUD(); alert("תוכנית הבסיס עודכנה.");
    }

    function recalcStats() {
      stats = { workouts: 0, distance: 0, time: 0, couples: 0 };
      Object.values(state.logs).forEach(log => {
        if(log.couples) stats.couples++;
        ['aerobic', 'resistance', 'snack'].forEach(type => {
          if(log[type]) {
            stats.workouts += log[type].length;
            log[type].forEach(b => {
              if(b.time) stats.time += b.time;
              if(b.distance) stats.distance += b.distance;
            });
          }
        });
      });
    }

    function renderTrophyRoom() {
      recalcStats();
      document.getElementById("statWorkouts").innerText = stats.workouts;
      document.getElementById("statDistance").innerText = stats.distance.toFixed(1);
      document.getElementById("statTime").innerText = (stats.time / 60).toFixed(1);
      document.getElementById("statCouples").innerText = stats.couples;

      const container = document.getElementById("badgeContainer");
      container.innerHTML = BADGES.map(b => {
        let val = b.type === 'time' ? stats.time : stats[b.type];
        let unlocked = val >= b.thresh;
        return `
          <div class="badge-card tier-${b.tier} ${unlocked ? 'unlocked' : ''}">
            <div class="badge-icon">${b.icon}</div>
            <span class="badge-title">${b.title}</span>
            <span class="badge-desc">${b.desc}</span>
          </div>
        `;
      }).join('');
    }

    function saveState() {
      localStorage.setItem("health_v2_state", JSON.stringify(state));
    }

    /* Drive Sync Protocol */
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';
    let tokenClient;
    let pendingAction = null;

    function saveClientId() {
      const id = document.getElementById("gcpClientId").value.trim();
      if(id) { localStorage.setItem("gdrive_client_id", id); alert("מזהה נשמר."); }
    }

    function updateSyncStatus(msg, isErr=false) {
      const el = document.getElementById("syncStatus");
      el.innerText = msg; el.style.color = isErr ? "var(--danger)" : "var(--easy)";
    }

    function authenticateDrive(action) {
      const clientId = localStorage.getItem("gdrive_client_id");
      if (!clientId) return updateSyncStatus("אנא הזיני מזהה לקוח קודם.", true);
      updateSyncStatus("מבצע אימות מול גוגל...");
      pendingAction = action;
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId, scope: SCOPES,
        callback: (response) => {
          if (response.error) updateSyncStatus("אימות נכשל.", true);
          else {
              if (pendingAction === 'push') executePush(response.access_token);
              else if (pendingAction === 'pull') executePull(response.access_token);
          }
        }
      });
      tokenClient.requestAccessToken();
    }

    async function executePush(token) {
      updateSyncStatus("מעלה נתונים לדרייב...");
      try {
        const query = encodeURIComponent(`name='health_tracker_v2_data.json' and trashed=false`);
        const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${query}&fields=files(id)`, { headers: { Authorization: `Bearer ${token}` }});
        const listData = await listRes.json();
        
        const payload = JSON.stringify(state);

        if (!listData.files || listData.files.length === 0) {
          const metadata = { name: 'health_tracker_v2_data.json', mimeType: 'application/json' };
          const form = new FormData();
          form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
          form.append('file', new Blob([payload], { type: 'application/json' }));
          
          await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { Authorization: `Bearer ${token}` }, body: form });
        } else {
          const fileId = listData.files[0].id;
          await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, { method: 'PATCH', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: payload });
        }
        updateSyncStatus(`✓ נשמר לדרייב בהצלחה (${new Date().toLocaleTimeString()})`);
      } catch (err) { updateSyncStatus(`שגיאת העלאה: ${err.message}`, true); }
    }

    async function executePull(token) {
      updateSyncStatus("מוריד נתונים מהדרייב...");
      try {
        const query = encodeURIComponent(`name='health_tracker_v2_data.json' and trashed=false`);
        const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${query}&fields=files(id)`, { headers: { Authorization: `Bearer ${token}` }});
        const listData = await listRes.json();

        if (!listData.files || listData.files.length === 0) {
            return updateSyncStatus("לא נמצא קובץ בדרייב. יש לגבות קודם.", true);
        }

        const fileId = listData.files[0].id;
        const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, { headers: { Authorization: `Bearer ${token}` }});
        const data = await res.json();
        
        if(data && data.meta && data.blueprint) {
            state = data;
            if (!state.challenges) state.challenges = {}; // Safety check post-pull
            saveState();
            init();
            updateSyncStatus(`✓ הנתונים שוחזרו בהצלחה (${new Date().toLocaleTimeString()})`);
        } else {
            updateSyncStatus("הקובץ אינו תקין.", true);
        }
      } catch (err) { updateSyncStatus(`שגיאת הורדה: ${err.message}`, true); }
    }

    window.onload = init;
  </script>
</body>
</html>
